name: Required quality
on:
  workflow_call:
    inputs:
      code_ref:
        description: Exact production revision to validate; empty uses the caller revision.
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  independent:
    name: Platform-independent checks
    runs-on: ubuntu-24.04
    container: ghcr.io/cpeter1207/rpt-advanced-quality-debian13:latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rpt_advanced
          ref: ${{ inputs.code_ref || github.sha }}
      - name: Check formatting, analysis, and documentation concurrently
        run: make -j3 quality
  platforms:
    needs: independent
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/cpeter1207/rpt-advanced-quality-debian13:latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rpt_advanced
          ref: ${{ inputs.code_ref || github.sha }}
      - name: Verify target architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(dpkg --print-architecture)" = "$EXPECTED_ARCH"
      - name: Build, test, package, and stage installation
        run: |
          make platform-verify
          DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b
  coverage:
    needs: independent
    runs-on: ubuntu-24.04
    container: ghcr.io/cpeter1207/rpt-advanced-quality-debian13:latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rpt_advanced
          ref: ${{ inputs.code_ref || github.sha }}
      - name: Collect amd64 coverage
        run: make coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-debian13-amd64
          path: build/coverage
          if-no-files-found: error
  required:
    name: Required quality gate
    if: always()
    needs: [independent, platforms, coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks
        env:
          INDEPENDENT: ${{ needs.independent.result }}
          PLATFORMS: ${{ needs.platforms.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: test "$INDEPENDENT" = success && test "$PLATFORMS" = success && test "$COVERAGE" = success
