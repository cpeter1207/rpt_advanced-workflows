name: Validate workflows
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify staged qualification contracts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          export PYTHONDONTWRITEBYTECODE=1
          for suite in staged_phone staged_package_plan installed_phone staged_gates staged_sofia staged_testbed staged_workflow staged_image; do
            python3 "tools/test_${suite}.py"
          done
      - name: Verify CI-only cohort regression contracts
        run: python3 tools/test_phone_cohort.py
      - name: Verify release package staging
        run: python3 tools/test_release_artifact_path.py
      - name: Verify release package-index notification
        run: python3 tools/test_release_index_dispatch.py
      - name: Verify signed radio product inputs
        run: python3 tools/test_radio_product_dependencies.py
      - name: Verify focused coverage runner
        run: python3 tools/test_focused_coverage.py
      - name: Verify constrained quality launcher
        run: python3 tools/test_quality_container.py
      - name: Verify performance and memory reporting
        run: python3 tools/test_resource_report.py
      - name: Verify installed image package selection
        run: python3 tools/test_stage_test_image_packages.py
      - name: Verify private Sofia provisioning
        run: python3 tools/test_private_sofia.py
      - uses: raven-actions/actionlint@v2
