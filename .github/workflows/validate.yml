name: Validate workflows
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify release package staging
        run: python3 tools/test_release_artifact_path.py
      - name: Verify release package-index notification
        run: python3 tools/test_release_index_dispatch.py
      - name: Verify signed radio product inputs
        run: python3 tools/test_radio_product_dependencies.py
      - name: Verify focused coverage runner
        run: python3 tools/test_focused_coverage.py
      - name: Verify constrained quality launcher
        run: python3 tools/test_quality_container.py
      - name: Verify performance and memory reporting
        run: python3 tools/test_resource_report.py
      - name: Verify installed image package selection
        run: python3 tools/test_stage_test_image_packages.py
      - uses: raven-actions/actionlint@v2
