name: Validate workflows
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify release package staging
        run: python3 tools/test_release_artifact_path.py
      - uses: raven-actions/actionlint@v2
