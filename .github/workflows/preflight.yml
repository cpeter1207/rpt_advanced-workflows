name: Fast quality
on:
  workflow_call:
    inputs:
      code_ref:
        description: Exact production revision to check; empty uses the caller revision.
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  preflight:
    name: Fast quality
    runs-on: ubuntu-24.04
    container: ghcr.io/cpeter1207/rpt-advanced-quality-debian13:latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rpt_advanced
          ref: ${{ inputs.code_ref || github.sha }}
      - name: Install ABI-matched shared dependencies
        uses: cpeter1207/rpt_advanced-workflows/.github/actions/install-shared-dependencies@main
        with:
          install: 'true'
      - name: Check formatting, lint, and static analysis
        run: make -j2 lint static-analysis
