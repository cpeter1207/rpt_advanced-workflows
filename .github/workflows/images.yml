name: Publish quality images
on:
  workflow_dispatch:
    inputs:
      production_ref:
        description: Production branch, tag, or commit whose dependency manifest this image will use
        type: string
        default: main
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: quality-image-publication
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Remove stale test containers
        run: |
          docker ps -aq --filter label=rpt_advanced.test=true | xargs -r docker rm -f
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rpt_advanced
          ref: ${{ inputs.production_ref }}
          path: production
      - uses: ./.github/actions/install-shared-dependencies
        with:
          manifest: production/.github/dependencies.json
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/quality.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: DEBIAN_VERSION=13
          build-contexts: dependencies=dependencies/packages
          load: true
          tags: ghcr.io/cpeter1207/rpt-advanced-quality-debian13:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=quality-debian13-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=quality-debian13-${{ matrix.arch }}
      - name: Verify prepared environment and publish architecture image
        env:
          IMAGE: ghcr.io/cpeter1207/rpt-advanced-quality-debian13:${{ github.sha }}-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          expected_packages=$(jq -r '.[] | .packages[]' production/.github/dependencies.json)
          test -n "$expected_packages"
          docker run --rm --label rpt_advanced.test=true -e ARCH -e "EXPECTED_PACKAGES=$expected_packages" "$IMAGE" sh -c '
            test "$(dpkg --print-architecture)" = "$ARCH" &&
            test -f /usr/include/asterisk.h && test -f /usr/lib/llvm-*/lib/libclang.so &&
            asterisk -V && ffmpeg -version && cargo --version && rustc --version &&
            rustfmt --version && cargo +nightly-2025-02-20 fmt --version &&
            cargo clippy --version && rustdoc --version &&
            printf "%s\n" "$EXPECTED_PACKAGES" | while IFS= read -r package; do dpkg-query -W "$package"; done &&
            pkg-config --exists rate_adjusting_pcm_ring3 rptadv_samplerate_adapter &&
            test -f "$(pkg-config --variable=libdir rate_adjusting_pcm_ring3)/librate_adjusting_pcm_ring3.so.3" &&
            test -f "$(pkg-config --variable=libdir rptadv_samplerate_adapter)/librptadv_samplerate_adapter.so.2" &&
            test "$(pkg-config --variable=abi_version rptadv_samplerate_adapter)" = 2 &&
            find /usr/include -path "/usr/include/rate_adjusting_pcm_ring*/rate_adjusting_pcm_ring*.h" -print -quit | grep -q . &&
            test -f /usr/include/rptadv_samplerate_adapter/rptadv_samplerate_adapter.h &&
            test -f /usr/include/rptadvradio/rptadvradio.h &&
            test -f /usr/include/rptadv_portaudio_alsa_adapter/rptadv_portaudio_alsa_adapter.h &&
            test -f /usr/include/rptadv_gpio_adapter/rptadv_gpio_adapter.h &&
            test -f /usr/include/rptadv_ffmpeg_adapter/rptadv_ffmpeg_adapter.h &&
            dpkg-query -W libusbradioplus-product1 libusbradioplus-product-dev &&
            pkg-config --exists usbradioplus_product &&
            test "$(pkg-config --variable=abi_version usbradioplus_product)" = 1 &&
            test -f /usr/include/usbradioplus_product.h &&
            test -f "$(pkg-config --variable=libdir usbradioplus_product)/libusbradioplus_product.so.1" &&
            pkg-config --exists rptadv_iax2 &&
            test "$(pkg-config --variable=abi_version rptadv_iax2)" = 1 &&
            test -f /usr/include/rptadv_iax2/rptadv_iax2_client.h &&
            test -f "$(pkg-config --variable=libdir rptadv_iax2)/librptadviax2.so.1" &&
            jq --version &&
            cc --version && clang-format --version && clang-tidy --version &&
            cppcheck --version && doxygen --version && ruff --version && gcovr --version &&
            cargo llvm-cov --version
          '
          docker push "$IMAGE"
      - name: Remove test containers left by interruption
        if: always()
        run: |
          docker ps -aq --filter label=rpt_advanced.test=true | xargs -r docker rm -f
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified native-platform manifest
        env:
          IMAGE: ghcr.io/cpeter1207/rpt-advanced-quality-debian13
          REVISION: ${{ github.sha }}
        run: |
          docker buildx imagetools create -t "$IMAGE:latest" \
            "$IMAGE:$REVISION-amd64" "$IMAGE:$REVISION-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"
