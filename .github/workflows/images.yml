name: Publish quality images
on:
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
concurrency:
  group: quality-image-publication
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Remove stale test containers
        run: |
          docker ps -aq --filter label=rpt_advanced.test=true | xargs -r docker rm -f
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-shared-dependencies
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/quality.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: DEBIAN_VERSION=13
          build-contexts: dependencies=dependencies/packages
          load: true
          tags: ghcr.io/cpeter1207/rpt-advanced-quality-debian13:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=quality-debian13-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=quality-debian13-${{ matrix.arch }}
      - name: Verify prepared environment and publish architecture image
        env:
          IMAGE: ghcr.io/cpeter1207/rpt-advanced-quality-debian13:${{ github.sha }}-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --label rpt_advanced.test=true -e ARCH "$IMAGE" sh -c '
            test "$(dpkg --print-architecture)" = "$ARCH" &&
            test -f /usr/include/asterisk.h && ldconfig -p | grep -q 'libclang.so' &&
            asterisk -V && ffmpeg -version && cargo --version && rustc --version &&
            rustfmt --version && cargo clippy --version && rustdoc --version &&
            dpkg-query -W librate-adjusting-pcm-ring2-dev librptadv-samplerate-adapter-dev &&
            cc --version && clang-format --version && clang-tidy --version &&
            cppcheck --version && doxygen --version && ruff --version && gcovr --version &&
            cargo llvm-cov --version
          '
          docker push "$IMAGE"
      - name: Remove test containers left by interruption
        if: always()
        run: |
          docker ps -aq --filter label=rpt_advanced.test=true | xargs -r docker rm -f
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified native-platform manifest
        env:
          IMAGE: ghcr.io/cpeter1207/rpt-advanced-quality-debian13
          REVISION: ${{ github.sha }}
        run: |
          docker buildx imagetools create -t "$IMAGE:latest" \
            "$IMAGE:$REVISION-amd64" "$IMAGE:$REVISION-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"
