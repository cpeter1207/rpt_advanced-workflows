name: Install released rpt_advanced shared dependencies
description: Download digest-verified Debian packages for the active native architecture.

inputs:
  manifest:
    description: Dependency manifest from the production checkout.
    default: .github/dependencies.json
  install:
    description: Install the selected packages into a Debian 13 validation job.
    default: 'false'

outputs:
  package-directory:
    value: ${{ steps.dependencies.outputs.package_directory }}

runs:
  using: composite
  steps:
    - name: Install dependency action tools
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v gh >/dev/null || ! command -v jq >/dev/null || ! command -v curl >/dev/null; then
          privilege=()
          if [[ "$(id -u)" != 0 ]]; then privilege=(sudo); fi
          "${privilege[@]}" apt-get update
          "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gh jq
        fi
    - uses: cpeter1207/rptadv-shared-library-workflows/actions/install-candidate-dependencies@main
      with:
        manifest: ${{ inputs.manifest }}
        package-directory: dependencies/packages
        install: 'false'
    - id: dependencies
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INSTALL_PACKAGES: ${{ inputs.install }}
        MANIFEST_PATH: ${{ inputs.manifest }}
      run: |
        set -euo pipefail
        architecture=$(dpkg --print-architecture)
        case "$architecture" in amd64|arm64) ;; *) exit 1 ;; esac
        directory="$GITHUB_WORKSPACE/dependencies/packages"
        mkdir -p "$directory"
        download() {
          repository=$1 tag=$2 package=$3
          if [[ -f "$MANIFEST_PATH" ]] &&
            jq -e --arg repository "$repository" 'any(.[]; .repository == $repository)' \
              "$MANIFEST_PATH" >/dev/null; then return; fi
          metadata=$(gh api "repos/cpeter1207/$repository/releases/tags/$tag")
          asset=$(jq -er --arg package "$package" --arg architecture "$architecture" '
            [.assets[] | select(.name | startswith($package + "_")) |
              select(.name | endswith("_" + $architecture + ".deb"))] |
            if length == 1 then .[0] else error("missing or ambiguous package asset") end
          ' <<< "$metadata")
          file="$directory/$(jq -r .name <<< "$asset")"
          curl --fail --location --silent --show-error --retry 3 \
            "$(jq -r .browser_download_url <<< "$asset")" --output "$file"
          printf '%s  %s\n' "$(jq -er '.digest | ltrimstr("sha256:")' <<< "$asset")" "$file" | sha256sum -c -
        }
        download rate_adjusting_pcm_ring v2.0.0-alpha.3 librate-adjusting-pcm-ring2
        download rate_adjusting_pcm_ring v2.0.0-alpha.3 librate-adjusting-pcm-ring2-dev
        download rptadv-samplerate-adapter v0.1.0-alpha.2 librptadv-samplerate-adapter1
        download rptadv-samplerate-adapter v0.1.0-alpha.2 librptadv-samplerate-adapter-dev
        download librptadviax2 v0.1.0-alpha4 librptadv-iax2-client1
        download librptadviax2 v0.1.0-alpha4 librptadv-iax2-client-dev
        if [[ "$INSTALL_PACKAGES" == true ]]; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --reinstall -y "$directory"/*.deb
          ldconfig
        fi
        printf 'package_directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
